name: Weekly Analysis Agent

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Weekly Analysis Agent
        run: npm run weekly:analyze

      - name: Commit Updated Analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/analysisCurrent.ts analysis/out/latest-round.json analysis/out/latest-evidence.json
          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
          else
            git commit -m "chore: weekly automated analysis refresh"
            git push
          fi